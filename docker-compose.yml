version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lead_crm_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lead_crm
    ports:
      - "5433:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: lead_crm_redis
    restart: always
    ports:
      - "6380:6379"

  backend:
    build: ./backend
    container_name: lead_crm_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://postgres:password@postgres:5432/lead_crm?schema=public"
      PORT: 4000
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  postgres-data:
